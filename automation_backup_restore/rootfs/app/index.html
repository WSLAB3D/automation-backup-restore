<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Backup & Restore</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 20px;
            color: #4fc3f7;
        }
        .card {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .status-item {
            background: #3d3d3d;
            padding: 15px;
            border-radius: 6px;
        }
        .status-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        .status-value {
            font-size: 24px;
            font-weight: bold;
            color: #4fc3f7;
        }
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            background: #4fc3f7;
            color: #1a1a1a;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #29b6f6;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .message.success {
            background: #2e7d32;
            color: white;
        }
        .message.error {
            background: #c62828;
            color: white;
        }
        .message.info {
            background: #0277bd;
            color: white;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .results {
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            background: #3d3d3d;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Automation Backup & Restore</h1>
        
        <div class="card">
            <h2>Status</h2>
            <div class="status-grid">
                <div class="status-item">
                    <div class="status-label">Backup YAML Automations</div>
                    <div class="status-value" id="backup-yaml-count">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Backup UI Automations</div>
                    <div class="status-value" id="backup-ui-count">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Current YAML Automations</div>
                    <div class="status-value" id="current-yaml-count">-</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Current UI Automations</div>
                    <div class="status-value" id="current-ui-count">-</div>
                </div>
            </div>
            <div class="status-item" style="margin-bottom: 15px;">
                <div class="status-label">Last Backup</div>
                <div class="status-value" id="last-backup" style="font-size: 16px;">-</div>
            </div>
        </div>
        
        <div class="card">
            <h2>Actions</h2>
            <div class="button-group">
                <button onclick="createBackup()">💾 Create Backup</button>
                <button onclick="restoreBackup()">♻️ Restore Backup</button>
                <button onclick="reloadAutomations()">🔄 Reload Automations</button>
                <button onclick="refreshStatus()">📊 Refresh Status</button>
            </div>
            <div id="message" class="message"></div>
            <div id="results" class="results"></div>
        </div>
    </div>

    <script>
        async function refreshStatus() {
            console.log('refreshStatus called');
            try {
                console.log('Fetching /api/status');
                const response = await fetch('/api/status');
                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                document.getElementById('backup-yaml-count').textContent = data.backup_yaml_count;
                document.getElementById('backup-ui-count').textContent = data.backup_ui_count;
                document.getElementById('current-yaml-count').textContent = data.current_yaml_count;
                document.getElementById('current-ui-count').textContent = data.current_ui_count;
                document.getElementById('last-backup').textContent = data.recorded_at || 'No backup';
            } catch (error) {
                console.error('Error fetching status:', error);
                showMessage('Failed to fetch status', 'error');
            }
        }

        async function createBackup() {
            showMessage('Creating backup...', 'info');
            try {
                const response = await fetch('/api/backup', { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    showMessage(data.message, 'success');
                    refreshStatus();
                } else {
                    showMessage('Backup failed', 'error');
                }
            } catch (error) {
                showMessage('Failed to create backup', 'error');
            }
        }

        async function restoreBackup() {
            showMessage('Restoring backup...', 'info');
            try {
                const response = await fetch('/api/restore', { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    showMessage('Restore completed successfully', 'success');
                    showResults(data.results);
                    refreshStatus();
                } else {
                    showMessage('Restore completed with errors', 'error');
                    showResults(data.results);
                    showResults(data.errors);
                }
            } catch (error) {
                showMessage('Failed to restore backup', 'error');
            }
        }

        async function reloadAutomations() {
            showMessage('Reloading automations...', 'info');
            try {
                const response = await fetch('/api/reload', { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    showMessage('Automations reloaded successfully', 'success');
                } else {
                    showMessage('Failed to reload automations', 'error');
                }
            } catch (error) {
                showMessage('Failed to reload automations', 'error');
            }
        }

        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
            
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 5000);
        }

        function showResults(items) {
            const resultsEl = document.getElementById('results');
            resultsEl.innerHTML = items.join('\n');
            resultsEl.style.display = 'block';
        }

        // Refresh status on load
        refreshStatus();
    </script>
</body>
</html>
